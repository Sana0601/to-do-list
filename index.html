<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <div>
                <p class="small-title">MY DAY</p>
                <h1>My To-Do List 📝</h1>
                <p class="date" id="date"></p>
            </div>

            <div class="task-count">
                <span id="count">0</span>
                <small>Tasks</small>
            </div>
        </div>

        <!-- Add Task -->
        <div class="input-box">
            <input type="text" id="taskInput" placeholder="What do you need to do?">
            <button onclick="addTask()">+</button>
        </div>

        <!-- Search -->
        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="🔍 Search tasks..."
            onkeyup="displayTasks()"
        >

        <!-- Filters -->
        <div class="filters">
            <button class="filter active" onclick="setFilter('all', this)">
                All
            </button>

            <button class="filter" onclick="setFilter('active', this)">
                Active
            </button>

            <button class="filter" onclick="setFilter('completed', this)">
                Completed
            </button>
        </div>

        <!-- Tasks -->
        <div id="taskList"></div>

        <div id="emptyMessage" class="empty">
            <div>✨</div>
            <p>No tasks yet!</p>
            <small>Add something you want to accomplish today.</small>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
